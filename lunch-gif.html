<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>점심 조추첨 — Lunch Draw</title>
<meta name="description" content="공을 뽑고 종이를 펼치면 오늘의 점심 메뉴가 공개됩니다.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="MY ANSWER IS">
<meta property="og:title" content="점심 조추첨 — Lunch Draw">
<meta property="og:description" content="점심 조추첨이 완료 되었습니다 · 이의 제기는 받지 않습니다">
<meta property="og:image" content="https://myansweris.vercel.app/assets/og-lunch.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://myansweris.vercel.app/lunch-gif">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="점심 조추첨 — Lunch Draw">
<meta name="twitter:description" content="점심 조추첨이 완료 되었습니다 · 이의 제기는 받지 않습니다">
<meta name="twitter:image" content="https://myansweris.vercel.app/assets/og-lunch.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js" integrity="sha384-TiCUE00h649CAMonG018J2ujOgDKW/kVWlChEuu4jK2vxfAAD0eZxzCKakxg55G4" crossorigin="anonymous"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#050e46;font-family:'Noto Sans KR',sans-serif;color:#fff}
.app{min-height:100dvh;max-width:430px;margin:0 auto;display:flex;flex-direction:column;
  background:linear-gradient(150deg,#12aede 0%,#1b2fae 38%,#3c1a9e 62%,#a01283 100%);
  padding:0 20px 30px;position:relative;overflow:hidden}
.logo{display:block;width:220px;margin:16px auto 0;filter:drop-shadow(0 2px 14px rgba(0,0,40,.35))}
h1{margin:14px 0 6px;font-size:25px;font-weight:700;line-height:1.35;text-align:center;letter-spacing:-.3px}
h1 span{color:#8db6ff}
.sub{margin:0;font-size:13px;line-height:1.5;color:rgba(255,255,255,.55);text-align:center}
.stagewrap{flex:1;display:flex;align-items:center;justify-content:center;padding:18px 0}
.stage{position:relative;width:100%;border-radius:14px;overflow:hidden;background:#0a0f1e;
  box-shadow:0 18px 44px rgba(0,0,20,.45);aspect-ratio:400/224;container-type:inline-size}
.stage img.scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
/* 종이 안쪽 — GIF 원본 좌표에 맞춤 (x 76-232 / y 66-125 of 400x224) */
/* 원본 카드에 박힌 "Manchester United FC (ENG)" 를 덮는 패치.
   종이 결을 살리려고 살짝 기울이고 옅은 그라데이션을 준다. */
/* 정지 프레임에서 실측한 종이 흰 영역: x 80-223 / y 62-101 (400x224).
   원본 카드에 박힌 "Manchester United FC (ENG)" 를 덮고 그 안에 메뉴를 앉힌다. */
/* 정지 프레임에서 격자로 실측한 종이: x 79-222 / y 60-124 (400x224).
   원본에 박힌 "Manchester United FC (ENG)" 3줄을 전부 덮는다. */
.patch{position:absolute;left:19.5%;top:26.3%;width:36.3%;height:29.5%;
  background:linear-gradient(177deg,#f7f7f5 0%,#f0f0ee 52%,#e7e7e5 100%);
  transform:rotate(-0.9deg);opacity:0;transition:opacity .18s;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.05)}
.patch.on{opacity:1}
.slip{position:absolute;left:19.8%;top:26.8%;width:35.8%;height:28.6%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;color:#20242c;transform:rotate(-0.9deg);opacity:0;
  font-family:'Noto Sans KR',sans-serif;z-index:1;padding:0 3%}
.slip.on{opacity:1}
.slip .name{font-weight:700;line-height:1.12;letter-spacing:-.02em;
  animation:stamp .42s cubic-bezier(.25,1.4,.4,1) both}
.slip .country{line-height:1.15;margin-top:.10em;
  animation:stamp .42s .12s cubic-bezier(.25,1.4,.4,1) both}
@keyframes stamp{from{opacity:0;transform:scale(1.75) rotate(-3deg)}to{opacity:1;transform:none}}
.cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:8px;background:linear-gradient(180deg,rgba(6,10,24,.55),rgba(6,10,24,.85));
  transition:opacity .4s;z-index:2}
.cover.hide{opacity:0;pointer-events:none}
.cover .star{font-size:30px}
.cover .t{font-size:clamp(16px,4.5cqw,22px);font-weight:700;letter-spacing:.02em}
.cover .s{font-size:clamp(11px,2.6cqw,13px);opacity:.72}
.btn{display:block;width:100%;max-width:320px;margin:0 auto;height:54px;padding:0 18px;
  border:none;border-radius:999px;background:linear-gradient(135deg,#6ea8ff,#2f6bff);
  color:#fff;font-family:inherit;font-size:16px;font-weight:700;line-height:1;
  cursor:pointer;box-shadow:0 10px 28px rgba(47,107,255,.45)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.55;cursor:default;transform:none}
/* 두 버튼은 같은 높이·같은 폭으로 나눠 갖는다 */
.row{display:flex;gap:10px;width:100%;max-width:320px;margin:0 auto}
.row>*{flex:1 1 0;min-width:0;height:54px;margin:0;padding:0 12px;border-radius:999px;
  box-sizing:border-box;border:1px solid transparent;
  font-family:inherit;font-size:15px;line-height:1;cursor:pointer}
.ghost{border:1px solid rgba(255,255,255,.16);background:rgba(10,14,40,.5);color:#fff;
  font-weight:500;backdrop-filter:blur(8px)}
.ghost:active{transform:scale(.98)}
.hint{margin:11px 0 0;font-size:11px;color:rgba(255,255,255,.45);text-align:center}
.sound{position:absolute;top:14px;right:14px;z-index:20;width:38px;height:38px;padding:0;
  display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.18);
  border-radius:50%;background:rgba(8,12,36,.45);backdrop-filter:blur(8px);color:#fff;
  font-size:15px;line-height:1;cursor:pointer}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){.slip .name,.slip .country{animation:none}}
</style>
</head>
<body>
<div class="app">
  <button class="sound" id="sound" aria-label="음악 끄기">🔊</button>
  <img class="logo" src="assets/logo-cut.png" alt="MY ANSWER IS">
  <h1 id="title">점심 하나를, <span>뽑아주세요.</span></h1>
  <p class="sub" id="sub">추첨식 버튼을 누르면 오늘의 메뉴가 정해집니다</p>

  <div class="stagewrap">
    <div class="stage" id="stage">
      <img class="scene" id="scene" alt="">
      <div class="patch" id="patch"></div>
      <div class="slip" id="slip">
        <div class="name" id="name"></div>
        <div class="country" id="country"></div>
      </div>
      <div class="cover" id="cover">
        <div class="star">⚽</div>
        <div class="t">LUNCH DRAW 2026</div>
        <div class="s">버튼을 누르면 추첨이 시작됩니다</div>
      </div>
    </div>
  </div>

  <button class="btn" id="start">추첨 시작</button>
  <div class="row" id="after" hidden>
    <button class="ghost" id="redraw">다시 뽑기</button>
    <button class="btn" id="share">카톡 공유</button>
  </div>
  <p class="hint" id="hint">메뉴 100개 중에 하나, 오늘은 이걸로 정해졌습니다</p>
</div>
<script src="lunch-menus.js"></script>
</body>
</html>
